name: "Specline"
description: "Validate a Specline repo's docs/ structure on pull requests. Blocks the merge on structural errors; posts findings as annotations."
branding:
  icon: check-circle
  color: red
inputs:
  path:
    description: "Path to the repo root to validate (contains docs/)."
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install Specline runtime dependencies
      shell: bash
      run: npm ci --omit=dev --prefix "$GITHUB_ACTION_PATH"
    - name: Run Specline
      shell: bash
      run: |
        base="${GITHUB_BASE_REF:-main}"
        # Fetch the base tip so we can diff against it (shallow checkouts lack it).
        git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
        # Resolve a usable base ref: prefer the remote-tracking branch, else the just-fetched tip.
        baseref="origin/$base"
        git rev-parse --verify -q "$baseref" >/dev/null 2>&1 || baseref="FETCH_HEAD"
        # Two-dot (not three-dot) so this works in a depth-1 clone with no merge base, and
        # `|| true` so a diff failure can never abort the gate under set -e / pipefail.
        changed="$(git diff --name-only "$baseref" HEAD -- 'docs/**' 2>/dev/null | tr '\n' ' ' || true)"
        # modifications/deletions only (not additions) — for edit detection on archive/.
        # --no-renames so a graduation (specs/<slug>/spec.md -> archive/<slug>/spec.md)
        # reads as a delete + an add, not a rename: the archive add is correctly excluded
        # (graduation is allowed), while true archive edits (M) and deletions (D), including
        # a rename that moves an archived file, still register on their old path.
        modified="$(git diff --no-renames --name-status "$baseref" HEAD -- 'docs/**' 2>/dev/null | awk '$1 ~ /^[MD]/ {print $NF}' | tr '\n' ' ' || true)"
        echo "Changed under docs/: ${changed:-<none>}"
        echo "Modified (not added): ${modified:-<none>}"
        node "$GITHUB_ACTION_PATH/src/action/main.ts" "${{ inputs.path }}" \
          --now "$(date -u +%Y-%m-%d)" \
          --changed "$changed" \
          --modified "$modified"
